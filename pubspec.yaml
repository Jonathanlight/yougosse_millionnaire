name: millionaire_city
description: "Yougosse Millionnaire - Un jeu de construction de ville"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Game Engine
  flame: ^1.23.0
  flame_audio: ^2.10.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Persistence
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Connectivity
  connectivity_plus: ^6.1.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.0
  collection: ^1.19.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.6
  in_app_purchase: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#1E1E1E"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/audio/
    - assets/data/
    - assets/building/
    - assets/building/home/
    - assets/building/maison/
    - assets/building/immeuble/
    - assets/building/commerce/
    - assets/building/activity/
    - assets/building/decoration/
    - assets/building/monument/
    - assets/building/route/
    - assets/person/
    - assets/avatar/